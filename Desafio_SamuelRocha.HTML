<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
  <script>
    alert("Boas Vindas ao Site!");

        let distancia = parseFloat(prompt("Qual a distância percorrida da sua casa até seu trabalho (em km)?"));
        let consumo = parseFloat(prompt("Qual o consumo médio do seu veículo (em Km/L)?")); 
        let somaValores = 0;
        let menorValor = 0;
    

        let consumo_Necessario_Litros = distancia / consumo;

        function texto(mensagem) {
            document.write(mensagem);
            document.write("<br>");
        }
        texto(`O consumo necessário é ${consumo_Necessario_Litros.toFixed(2)} litros`);
    </script>

</body>
</html>
